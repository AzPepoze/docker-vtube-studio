# One-time setup only: temporary browser access to log into Steam and
# click "Allow" for MapleAI. Start the main service first, then run:
#   docker compose -f compose.yml -f compose.setup.yml --profile setup up setup
# Open http://your-server:6080, do the clicks, then stop it with Ctrl-C
# and never run it again.

services:
  vts:
    ports:
      - "6080:6080"

  setup:
    build:
      context: .
      target: setup
    # NOTE: the image inherits ENTRYPOINT ["entrypoint.sh"] from the vts
    # stage — override it, this container only bridges VNC to the main
    # container's display (shared via the x11 volume + network namespace).
    entrypoint: ["/usr/local/bin/setup-vnc.sh"]
    network_mode: "service:vts"
    depends_on:
      - vts
    volumes:
      - x11:/tmp/.X11-unix
    env_file:
      - path: .env
        required: false
    profiles:
      - setup
