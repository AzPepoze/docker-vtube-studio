# One-time setup only: temporary browser access to log into Steam and
# click "Allow" for MapleAI. Start the main service first, then run:
#   docker compose -f compose.yml -f compose.setup.yml --profile setup up setup
# Open http://your-server:6080, do the clicks, then stop it with Ctrl-C
# and never run it again.

services:
  vts:
    ports:
      - "6080:6080"

  setup:
    build:
      context: .
      target: setup
    network_mode: "service:vts"
    volumes:
      - x11:/tmp/.X11-unix
    env_file:
      - .env
    profiles:
      - setup
