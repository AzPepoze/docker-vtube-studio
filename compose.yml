name: vtuber-studio

services:
  vts:
    build:
      context: .
      target: vts
    image: vtuber-studio:latest
    container_name: vtube-studio
    ports:
      - "${VTS_PORT:-8001}:8001"
      - "${STREAM_PORT:-8090}:8080"
      - "6080:6080"
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      HOST_VTS_PORT: ${VTS_PORT:-8001}
      HOST_STREAM_PORT: ${STREAM_PORT:-8090}
      STREAM_FPS: ${STREAM_FPS:-60}
      SCREEN_GEOM: ${SCREEN_GEOM:-640x360x24}
      LP_NUM_THREADS: ${LP_NUM_THREADS:-4}
      VTS_UPDATE_ON_START: ${VTS_UPDATE_ON_START:-0}
      STEAM_USER: ${STEAM_USER:-}
      STEAM_PASS: ${STEAM_PASS:-}
      STEAM_GUARD: ${STEAM_GUARD:-}
    volumes:
      - vts-data:/data
      - x11:/tmp/.X11-unix
    stdin_open: true
    tty: true
    ipc: shareable
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8001' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  vnc:
    build:
      context: .
      target: vnc
    image: vtube-studio-vnc
    container_name: vtube-studio-vnc
    entrypoint: ["/usr/local/bin/vnc-bridge.sh"]
    network_mode: "service:vts"
    ipc: service:vts
    depends_on:
      - vts
    volumes:
      - x11:/tmp/.X11-unix
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      DISPLAY: ":99"
    profiles:
      - vnc
    restart: unless-stopped

volumes:
  vts-data:
  x11:
